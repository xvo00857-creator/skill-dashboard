<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 — 控制台</title>
<style>
/* ===== Design Tokens (内联，自包含) ===== */
:root{
  --color-primary-50:#eef4ff;--color-primary-100:#d9e6ff;--color-primary-200:#bcd3ff;
  --color-primary-300:#8eb6ff;--color-primary-400:#598dff;--color-primary-500:#3366ff;
  --color-primary-600:#254edb;--color-primary-700:#1d3db0;--color-primary-800:#1e368c;
  --color-primary-900:#1e3070;
  --color-gray-0:#fff;--color-gray-50:#f8f9fc;--color-gray-100:#f1f3f8;
  --color-gray-200:#e4e7ef;--color-gray-300:#cdd2de;--color-gray-400:#9ba3b5;
  --color-gray-500:#6b7280;--color-gray-600:#4b5563;--color-gray-700:#374151;
  --color-gray-800:#1f2937;--color-gray-900:#111828;
  --color-success:#16a34a;--color-success-bg:#dcfce7;--color-danger:#dc2626;
  --color-danger-bg:#fee2e2;
  --color-bg-body:var(--color-gray-50);--color-bg-surface:var(--color-gray-0);
  --color-text-primary:var(--color-gray-900);--color-text-secondary:var(--color-gray-500);
  --color-border:var(--color-gray-200);--color-border-strong:var(--color-gray-300);
  --font-family-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"PingFang SC","Microsoft YaHei",sans-serif;
  --font-size-xs:.75rem;--font-size-sm:.875rem;--font-size-base:1rem;--font-size-lg:1.125rem;
  --font-size-xl:1.25rem;--font-size-2xl:1.5rem;--font-size-3xl:1.875rem;
  --font-weight-regular:400;--font-weight-medium:500;--font-weight-semibold:600;--font-weight-bold:700;
  --line-height-tight:1.25;--line-height-normal:1.5;
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;--space-5:1.25rem;
  --space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;--space-12:3rem;
  --radius-sm:.25rem;--radius-md:.375rem;--radius-lg:.5rem;--radius-xl:.75rem;--radius-2xl:1rem;--radius-full:9999px;
  --shadow-sm:0 1px 2px 0 rgba(0,0,0,.05);--shadow-md:0 4px 6px -1px rgba(0,0,0,.08),0 2px 4px -2px rgba(0,0,0,.05);
  --shadow-lg:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -4px rgba(0,0,0,.05);
  --transition-fast:150ms ease;
  --auth-card-max-width:28rem;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-family-sans);font-size:var(--font-size-base);line-height:var(--line-height-normal);color:var(--color-text-primary);background:var(--color-bg-body);-webkit-font-smoothing:antialiased;min-height:100vh}

/* ===== 布局：分屏登录 ===== */
.auth-layout{display:flex;min-height:100vh}
.auth-hero{
  flex:1;display:none;flex-direction:column;justify-content:space-between;
  padding:var(--space-12);
  background:linear-gradient(135deg,var(--color-primary-700) 0%,var(--color-primary-500) 55%,var(--color-primary-400) 100%);
  color:#fff;position:relative;overflow:hidden;
}
.auth-hero::before{
  content:"";position:absolute;top:-40%;right:-30%;width:80%;height:80%;
  background:radial-gradient(circle,rgba(255,255,255,.12) 0%,transparent 70%);border-radius:50%;
}
.auth-hero::after{
  content:"";position:absolute;bottom:-30%;left:-20%;width:60%;height:60%;
  background:radial-gradient(circle,rgba(255,255,255,.08) 0%,transparent 70%);border-radius:50%;
}
@media(min-width:900px){.auth-hero{display:flex}}
.auth-hero-brand{display:flex;align-items:center;gap:var(--space-3);font-size:var(--font-size-xl);font-weight:var(--font-weight-bold);position:relative;z-index:1}
.auth-hero-brand-mark{display:flex;align-items:center;justify-content:center;width:2.25rem;height:2.25rem;background:rgba(255,255,255,.2);border-radius:var(--radius-md);font-size:var(--font-size-base)}
.auth-hero-content{position:relative;z-index:1;max-width:28rem}
.auth-hero-content h1{font-size:var(--font-size-3xl);font-weight:var(--font-weight-bold);line-height:var(--line-height-tight);margin-bottom:var(--space-4)}
.auth-hero-content p{font-size:var(--font-size-base);opacity:.85;line-height:var(--line-height-normal)}
.auth-hero-stats{display:flex;gap:var(--space-8);position:relative;z-index:1}
.auth-hero-stat-num{font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold)}
.auth-hero-stat-label{font-size:var(--font-size-xs);opacity:.7;margin-top:2px}

/* ===== 表单区 ===== */
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:var(--space-6)}
.auth-card{width:100%;max-width:var(--auth-card-max-width)}
.auth-card-header{margin-bottom:var(--space-8)}
.auth-card-header h2{font-size:var(--font-size-2xl);font-weight:var(--font-weight-bold);margin-bottom:var(--space-2)}
.auth-card-header p{font-size:var(--font-size-sm);color:var(--color-text-secondary)}

/* ===== 组件：按钮 ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);font-family:inherit;font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);line-height:1.25;border:1px solid transparent;border-radius:var(--radius-md);cursor:pointer;transition:background-color var(--transition-fast),border-color var(--transition-fast),box-shadow var(--transition-fast);white-space:nowrap;user-select:none}
.btn:focus-visible{outline:2px solid var(--color-primary-400);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-primary{background-color:var(--color-primary-500);color:#fff}
.btn-primary:hover:not(:disabled){background-color:var(--color-primary-600)}
.btn-secondary{background-color:var(--color-bg-surface);color:var(--color-text-primary);border-color:var(--color-border-strong)}
.btn-secondary:hover:not(:disabled){background-color:var(--color-gray-100)}
.btn-block{width:100%}
.btn-lg{padding:var(--space-3) var(--space-6);font-size:var(--font-size-base);border-radius:var(--radius-lg)}

/* ===== 组件：表单 ===== */
.form-group{margin-bottom:var(--space-4)}
.form-label{display:block;margin-bottom:var(--space-1);font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}
.form-input-wrap{position:relative}
.form-input{display:block;width:100%;padding:var(--space-2) var(--space-3);font-family:inherit;font-size:var(--font-size-sm);color:var(--color-text-primary);background-color:var(--color-bg-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);transition:border-color var(--transition-fast),box-shadow var(--transition-fast)}
.form-input::placeholder{color:var(--color-gray-400)}
.form-input:focus{outline:none;border-color:var(--color-primary-500);box-shadow:0 0 0 3px rgba(51,102,255,.15)}
.form-input-icon{position:absolute;right:var(--space-3);top:50%;transform:translateY(-50%);background:none;border:none;color:var(--color-gray-400);cursor:pointer;font-size:var(--font-size-sm);padding:2px}
.form-input-icon:hover{color:var(--color-gray-600)}
.form-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-6)}
.form-check{display:flex;align-items:center;gap:var(--space-2);font-size:var(--font-size-sm);color:var(--color-text-secondary);cursor:pointer}
.form-check input[type=checkbox]{width:1rem;height:1rem;accent-color:var(--color-primary-500);cursor:pointer}
.link{color:var(--color-primary-500);text-decoration:none;font-size:var(--font-size-sm);font-weight:var(--font-weight-medium)}
.link:hover{color:var(--color-primary-600)}

/* ===== 组件：分隔线 ===== */
.divider{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-6) 0;color:var(--color-text-secondary);font-size:var(--font-size-xs)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--color-border)}

/* ===== 组件：社交登录按钮 ===== */
.btn-social{display:flex;align-items:center;justify-content:center;gap:var(--space-2);width:100%;padding:var(--space-2) var(--space-4);font-family:inherit;font-size:var(--font-size-sm);font-weight:var(--font-weight-medium);color:var(--color-text-primary);background:var(--color-bg-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);cursor:pointer;transition:background-color var(--transition-fast)}
.btn-social:hover{background:var(--color-gray-100)}
.btn-social svg{width:1.125rem;height:1.125rem}

/* ===== 组件：提示条 ===== */
.alert{display:flex;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:var(--font-size-sm);margin-bottom:var(--space-4)}
.alert-danger{background:var(--color-danger-bg);color:#991b1b}

/* ===== 页脚 ===== */
.auth-footer{text-align:center;margin-top:var(--space-8);font-size:var(--font-size-sm);color:var(--color-text-secondary)}
</style>
</head>
<body>
<div class="auth-layout">

  <!-- 左侧品牌区 -->
  <aside class="auth-hero">
    <div class="auth-hero-brand">
      <span class="auth-hero-brand-mark">N</span>
      <span>Nimbus 控制台</span>
    </div>
    <div class="auth-hero-content">
      <h1>欢迎回来</h1>
      <p>登录以管理你的工作区、查看实时数据与团队协作动态。所有指标一目了然，决策快人一步。</p>
    </div>
    <div class="auth-hero-stats">
      <div>
        <div class="auth-hero-stat-num">12k+</div>
        <div class="auth-hero-stat-label">活跃团队</div>
      </div>
      <div>
        <div class="auth-hero-stat-num">99.9%</div>
        <div class="auth-hero-stat-label">服务可用性</div>
      </div>
      <div>
        <div class="auth-hero-stat-num">4.9</div>
        <div class="auth-hero-stat-label">用户评分</div>
      </div>
    </div>
  </aside>

  <!-- 右侧表单区 -->
  <main class="auth-main">
    <div class="auth-card">
      <div class="auth-card-header">
        <h2>登录账号</h2>
        <p>请输入你的邮箱和密码以继续</p>
      </div>

      <!-- 错误提示（默认隐藏，此处展示状态） -->
      <div class="alert alert-danger" role="alert" style="display:none" id="errorAlert">
        邮箱或密码错误，请重试。
      </div>

      <form onsubmit="return false;">
        <div class="form-group">
          <label class="form-label" for="email">邮箱地址</label>
          <input class="form-input" type="email" id="email" placeholder="you@example.com" value="name@company.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="password">密码</label>
          <div class="form-input-wrap">
            <input class="form-input" type="password" id="password" placeholder="请输入密码" value="password123">
            <button type="button" class="form-input-icon" aria-label="显示密码" onclick="togglePw()">显示</button>
          </div>
        </div>

        <div class="form-row">
          <label class="form-check">
            <input type="checkbox" checked> 记住我
          </label>
          <a href="#" class="link">忘记密码？</a>
        </div>

        <button type="submit" class="btn btn-primary btn-lg btn-block">登录</button>
      </form>

      <div class="divider">或使用以下方式</div>

      <div style="display:flex;gap:var(--space-3)">
        <button class="btn-social">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Google
        </button>
        <button class="btn-social">
          <svg viewBox="0 0 24 24" fill="#1f2937"><path d="M12 .3a12 12 0 0 0-3.8 23.38c.6.12.83-.26.83-.58v-2.03c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.09 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5 1 .1-.78.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.13-.3-.54-1.52.12-3.18 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.66 1.66.25 2.88.12 3.18a4.65 4.65 0 0 1 1.24 3.22c0 4.61-2.81 5.63-5.49 5.92.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .3"/></svg>
          GitHub
        </button>
      </div>

      <p class="auth-footer">还没有账号？<a href="#" class="link">免费注册</a></p>
    </div>
  </main>
</div>
<script>
function togglePw(){
  var p=document.getElementById('password');
  p.type=p.type==='password'?'text':'password';
}
</script>
</body>
</html>
