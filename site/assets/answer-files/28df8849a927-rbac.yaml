# RBAC: Jenkins agent 部署所用 ServiceAccount 的最小权限配置
# 凭证边界原则: 流水线 Pod 使用专用 ServiceAccount, 仅授予 demo 命名空间内
#   部署验证和回滚所需的最小权限, 不使用 cluster-admin 或 Jenkins 管理员令牌。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-deployer
  namespace: demo-project
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: demo-deployer-role
  namespace: demo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments/rollback"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: demo-deployer-binding
  namespace: demo
subjects:
  - kind: ServiceAccount
    name: demo-deployer
    namespace: demo-project
roleRef:
  kind: Role
  name: demo-deployer-role
  apiGroup: rbac.authorization.k8s.io
